name: Core

on:
  push:
    branches: [ main ]
    tags: [ v* ] 
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-core:

    runs-on: ubuntu-latest

    concurrency: 
      group: ${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v3
    - name: Install Rust Nightly
      uses: actions-rs/toolchain@v1
      with:
          toolchain: nightly
          override: true
          components: rustfmt, clippy
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libssl-dev \
          libasound2-dev \
          libudev-dev \
          jackd2 \
          libjack-jackd2-dev \
          protobuf-compiler
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache Cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Install cargo-deb
      if: startsWith(github.ref, 'refs/tags/')
      run: cargo install cargo-deb

    - name: Build
      working-directory: core
      run: cargo build --verbose

    - name: Run tests
      working-directory: core
      run: cargo test --verbose

    - name: Create Debian package
      if: startsWith(github.ref, 'refs/tags/')
      working-directory: core
      run: cargo deb
      
    - name: Upload Debian package
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: bloop-core-${{ github.ref_name }}.deb
        path: core/target/debian/*.deb

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: core/target/debian/*.deb
        generate_release_notes: true

  build-core-macos:

    runs-on: macos-latest

    concurrency:
      group: macos-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust Nightly
      uses: actions-rs/toolchain@v1
      with:
          toolchain: nightly
          override: true
          components: rustfmt, clippy

    - name: Add macOS Rust target
      run: rustup target add aarch64-apple-darwin

    - name: Install protobuf compiler
      run: |
        brew install protobuf
        protoc --version

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache Cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Cache Cargo build
      uses: actions/cache@v4
      with:
        path: core/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-

    - name: Install cargo-packager
      run: cargo install cargo-packager --locked

    - name: Run tests
      working-directory: core
      run: cargo test --verbose

    - name: Build macOS app bundle
      run: ./scripts/build-core-macos-app.sh

    - name: Verify macOS app bundle
      run: |
        APP_PATH="$(find target/macos-app/package -maxdepth 4 -type d -name 'Bloop.app' -print -quit)"
        test -n "$APP_PATH"
        test -x "$APP_PATH/Contents/MacOS/bloop-core"
        file "$APP_PATH/Contents/MacOS/bloop-core" | grep 'arm64'
        find "$APP_PATH/Contents/Resources" -name '*.icns' -type f | grep .

    - name: Upload macOS app bundle
      uses: actions/upload-artifact@v4
      with:
        name: bloop-core-macos-arm64-app
        path: target/macos-app/package/**/*.app
